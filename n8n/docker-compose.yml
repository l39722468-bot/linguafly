services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-n8n}
      POSTGRES_DB: n8n
    volumes:
      - n8n_postgres:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "5433:5432"

  n8n:
    image: n8nio/n8n:1.111.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}
      GENERIC_TIMEZONE: Europe/Madrid
      TZ: Europe/Madrid
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-n8n}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-change-me-in-production-please}
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      N8N_METRICS: "true"
      N8N_ENROLLMENT_HMAC_SECRET: ${N8N_ENROLLMENT_HMAC_SECRET:-}
      HUBSPOT_ACCESS_TOKEN: ${HUBSPOT_ACCESS_TOKEN:-}
      ENROLLMENT_FROM_EMAIL: ${ENROLLMENT_FROM_EMAIL:-}
      ENROLLMENT_ADMIN_EMAIL: ${ENROLLMENT_ADMIN_EMAIL:-}
      LINGUAFLY_DRAIN_URL: ${LINGUAFLY_DRAIN_URL:-http://host.docker.internal:5436/api/enrollment}
      ENROLLMENT_DRAIN_API_KEY: ${ENROLLMENT_DRAIN_API_KEY:-}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/home/node/workflows:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  n8n_postgres:
  n8n_data:

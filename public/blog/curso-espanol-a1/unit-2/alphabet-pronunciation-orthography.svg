<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Spanish alphabet and pronunciation for A1 learners</title>
  <desc id="desc">The Spanish vowels, ñ, j, rr and written accents for English-speaking beginners.</desc>
  <rect width="1200" height="630" fill="#ecfeff"/>
  <rect x="48" y="48" width="1104" height="534" rx="34" fill="#ffffff" stroke="#0f766e" stroke-width="6"/>
  <text x="100" y="150" fill="#134e4a" font-family="Arial, sans-serif" font-size="58" font-weight="700">Spanish A1 · Unit 2</text>
  <text x="100" y="220" fill="#0f766e" font-family="Arial, sans-serif" font-size="42">Alphabet, sounds and stress</text>
  <g font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">
    <rect x="105" y="285" width="145" height="115" rx="20" fill="#ccfbf1"/>
    <text x="177" y="360" fill="#115e59" font-size="58">a e i</text>
    <rect x="275" y="285" width="145" height="115" rx="20" fill="#dbeafe"/>
    <text x="347" y="360" fill="#1e3a8a" font-size="58">o u</text>
    <rect x="445" y="285" width="145" height="115" rx="20" fill="#fef3c7"/>
    <text x="517" y="360" fill="#92400e" font-size="58">ñ</text>
    <rect x="615" y="285" width="145" height="115" rx="20" fill="#fee2e2"/>
    <text x="687" y="360" fill="#991b1b" font-size="58">j</text>
    <rect x="785" y="285" width="145" height="115" rx="20" fill="#ede9fe"/>
    <text x="857" y="360" fill="#5b21b6" font-size="58">rr</text>
    <rect x="955" y="285" width="145" height="115" rx="20" fill="#ffedd5"/>
    <text x="1027" y="360" fill="#9a3412" font-size="58">¿?</text>
  </g>
  <text x="100" y="490" fill="#334155" font-family="Arial, sans-serif" font-size="30">Spell names · read vowels · place the written accent</text>
</svg>

name: IndexNow

on:
  push:
    branches:
      - main
    paths:
      - "src/content/blog/**/*.md"
      - "src/content/hubs/**/*.md"
  workflow_dispatch:
    inputs:
      mode:
        description: "Modo de envío IndexNow"
        required: false
        default: "changed"
        type: choice
        options:
          - changed
          - all

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"

      # OpenNext en Workers Builds suele tardar 5–12 min. Un IndexNow demasiado
      # pronto reintroduce 404 en Bing aunque el merge a main sea correcto.
      # verify-live excluye 404/410 reales; CF Bot Fight (403 challenge) no es 404.
      - name: Submit changed URLs to IndexNow
        env:
          BEFORE_SHA: ${{ github.event.before }}
          MODE: ${{ github.event.inputs.mode || 'changed' }}
          INDEXNOW_VERIFY_ATTEMPTS: "6"
          INDEXNOW_VERIFY_WAIT_MS: "60000"
        run: |
          echo "Espera inicial 480s (~8 min) para Workers Builds / OpenNext…"
          sleep 480
          if [ "$MODE" = "all" ]; then
            echo "Modo manual: enviando inventario completo (excluye 404/410 reales)."
            node scripts/indexnow-submit.mjs --all --verify-live
          elif [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "No before SHA disponible; enviando inventario completo (excluye 404/410 reales)."
            node scripts/indexnow-submit.mjs --all --verify-live
          else
            echo "Enviando URLs cambiadas desde $BEFORE_SHA (blog + hubs); excluye 404/410 reales"
            node scripts/indexnow-submit.mjs --since="$BEFORE_SHA" --verify-live
          fi

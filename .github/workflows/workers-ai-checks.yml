name: Workers AI migration checks

on:
  push:
    branches:
      - feat/workers-ai-conversation
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: workers-ai-migration-checks
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Test Workers AI adapter
        run: npm test -- --runInBand __tests__/unit/workers-ai.test.ts

      - name: Build OpenNext Worker
        env:
          NEXT_PUBLIC_SITE_URL: https://linguafly.app
          CI: "true"
        run: npm run cf:build

name: LinguaFly AI checks

on:
  push:
    branches:
      - feat/lingua-ai-cloudflare-auth
    paths:
      - "apps/lingua-ai/**"
      - ".github/workflows/lingua-ai-checks.yml"
  pull_request:
    paths:
      - "apps/lingua-ai/**"
      - ".github/workflows/lingua-ai-checks.yml"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/lingua-ai
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/lingua-ai/package-lock.json

      - name: Install dependencies from the committed lockfile
        run: npm ci --no-audit --no-fund

      - name: TypeScript
        run: npm run type-check

      - name: ESLint
        run: npm run lint

      - name: Next.js build
        run: npm run build

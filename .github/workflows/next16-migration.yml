name: Next.js 16 migration

on:
  push:
    branches:
      - chore/upgrade-next16-cloudflare

permissions:
  contents: write

concurrency:
  group: next16-migration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  install-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate npm lockfile
        run: npm install --no-audit --no-fund

      - name: Commit regenerated lockfile
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: regenerate lockfile for Next.js 16"
            git push
          fi

      - name: Type check
        run: npm run type-check

      - name: Build Cloudflare Worker
        run: npm run cf:build

name: Sync LinguaFly AI lockfile

on:
  push:
    branches:
      - feat/lingua-ai-cloudflare-auth
    paths:
      - "apps/lingua-ai/package.json"
      - ".github/workflows/lingua-ai-lockfile-sync.yml"

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/lingua-ai/package-lock.json

      - name: Resolve and write the app lockfile without install scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefix apps/lingua-ai

      - name: Commit lockfile only when it changed
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- apps/lingua-ai/package-lock.json; then
            echo "The lockfile is already in sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/lingua-ai/package-lock.json
          git commit -m "chore(lingua-ai): sincronizar package-lock"
          git push origin "HEAD:${GITHUB_REF_NAME}"

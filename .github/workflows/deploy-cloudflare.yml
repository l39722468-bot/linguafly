# Deploy Linguafly a Cloudflare Workers (OpenNext)
# Requiere secrets del repo:
#   CLOUDFLARE_API_TOKEN
#   CLOUDFLARE_ACCOUNT_ID
#
# Build command produce `.open-next/` y wrangler sube el Worker `linguafly`.

name: Deploy Cloudflare Workers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'mobile/**'
      - 'scripts/**'
      - '.github/workflows/translate-articles.yml'
      - '.github/workflows/indexnow.yml'
      - '.github/workflows/generate-podcast-audio.yml'

concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: OpenNext build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          NEXT_PUBLIC_SITE_URL: https://linguafly.app
        run: npx opennextjs-cloudflare build

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

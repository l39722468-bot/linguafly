# Deploy Linguafly a Cloudflare Workers (OpenNext)
#
# Por defecto el deploy en push lo hace Cloudflare Workers Builds
# (Worker conectado al repo). Este workflow queda solo manual
# (workflow_dispatch) por si hace falta un redeploy desde GitHub Actions.
#
# Secrets opcionales (solo si usas este workflow):
#   CLOUDFLARE_API_TOKEN
#   CLOUDFLARE_ACCOUNT_ID

name: Deploy Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply linguafly_db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CI: true

      - name: Seed magazine articles into D1
        run: |
          npx tsx scripts/sync-articles-to-d1.ts --sql-out /tmp/seed-articles.sql
          npx wrangler d1 execute linguafly_db --remote --file=/tmp/seed-articles.sql --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CI: true

      - name: OpenNext build
        env:
          NEXT_PUBLIC_SITE_URL: https://linguafly.app
          CI: true
        run: npm run cf:build

      - name: Verify OpenNext artifact
        # wrangler deploy needs .open-next/worker.js (wrangler.jsonc "main").
        # Fail here with a clear message if the OpenNext build did not produce it.
        run: |
          test -f .open-next/worker.js || {
            echo "::error::Missing .open-next/worker.js — the OpenNext build (npm run cf:build) did not generate it."
            exit 1
          }
          test -d .open-next/assets || {
            echo "::error::Missing .open-next/assets — the OpenNext build (npm run cf:build) did not generate it."
            exit 1
          }

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

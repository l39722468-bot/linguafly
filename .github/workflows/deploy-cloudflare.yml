# Deploy Linguafly a Cloudflare Workers (OpenNext)
#
# Por defecto el deploy en push lo hace Cloudflare Workers Builds
# (Worker conectado al repo). Este workflow queda solo manual
# (workflow_dispatch) por si hace falta un redeploy desde GitHub Actions.
#
# Secrets opcionales (solo si usas este workflow):
#   CLOUDFLARE_API_TOKEN
#   CLOUDFLARE_ACCOUNT_ID

name: Deploy Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: OpenNext build
        env:
          NEXT_PUBLIC_SITE_URL: https://linguafly.app
          CI: true
        run: npm run cf:build

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

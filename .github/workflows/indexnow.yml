name: IndexNow

on:
  push:
    branches:
      - main
    paths:
      - "src/content/blog/**/*.md"
      - "src/content/hubs/**/*.md"
  workflow_dispatch:
    inputs:
      mode:
        description: "Modo de envío IndexNow"
        required: false
        default: "changed"
        type: choice
        options:
          - changed
          - all

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"

      # Cloudflare Workers suele tardar unos minutos tras el push a main.
      # verify-live excluye solo 404/410 reales. Un 403 de Bot Fight (cf-mitigated:
      # challenge) NO es 404: los runners de GitHub suelen recibir challenge y
      # Bingbot no; esas URLs se envían igual tras el gate de main.
      - name: Submit changed URLs to IndexNow
        env:
          BEFORE_SHA: ${{ github.event.before }}
          MODE: ${{ github.event.inputs.mode || 'changed' }}
          INDEXNOW_VERIFY_ATTEMPTS: "4"
          INDEXNOW_VERIFY_WAIT_MS: "45000"
        run: |
          echo "Espera inicial 90s para el deploy de Cloudflare…"
          sleep 90
          if [ "$MODE" = "all" ]; then
            echo "Modo manual: enviando inventario completo (excluye 404/410 reales)."
            node scripts/indexnow-submit.mjs --all --verify-live
          elif [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "No before SHA disponible; enviando inventario completo (excluye 404/410 reales)."
            node scripts/indexnow-submit.mjs --all --verify-live
          else
            echo "Enviando URLs cambiadas desde $BEFORE_SHA (blog + hubs); excluye 404/410 reales"
            node scripts/indexnow-submit.mjs --since="$BEFORE_SHA" --verify-live
          fi

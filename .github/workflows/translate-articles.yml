name: Translate Blog Articles (ES → pt-BR)

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Re-translate all articles (even already translated)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run translation script
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="--force"
          fi
          npx ts-node scripts/translate-articles.ts $ARGS

      - name: Count translated files
        id: count
        run: |
          COUNT=$(find src/content/blog-pt-br -name '*.md' -o -name '*.mdx' | wc -l)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "📄 Total translated articles: $COUNT"

      - name: Commit and push translations
        if: steps.count.outputs.count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/blog-pt-br/
          if git diff --cached --quiet; then
            echo "No new translations to commit"
          else
            git commit -m "chore: translate blog articles ES → pt-BR [automated]"
            git push
          fi

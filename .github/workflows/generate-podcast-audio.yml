name: Generate Podcast Audio (A1)

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Regenerar todos los episodios (incluso los que ya tienen MP3)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      episode:
        description: "ID de episodio concreto (vacío = todos los faltantes o todos con force)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Generate podcast MP3 files
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          if [ -n "${{ inputs.episode }}" ]; then
            ARGS="$ARGS --episode ${{ inputs.episode }}"
          fi
          node scripts/generate-podcast-audio.mjs $ARGS

      - name: Count generated MP3 files
        if: always()
        id: count
        run: |
          COUNT=$(find public/audio/podcasts/a1 -name '*.mp3' | wc -l)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "🎙️ Total podcast MP3 files: $COUNT"

      - name: Commit and push audio files
        if: always() && steps.count.outputs.count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/audio/podcasts/a1/ src/lib/podcasts/audio-available.ts
          if git diff --cached --quiet; then
            echo "No new audio files to commit"
          else
            git commit -m "chore: generate A1 podcast audio [automated]"
            git push
          fi

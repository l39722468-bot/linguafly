name: Blog GEO-AEO audit

on:
  pull_request:
    paths:
      - "src/content/blog/**"
      - "src/app/blog/**"
      - "src/lib/seo/**"
      - "scripts/audit-blog-geo-aeo.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/blog-geo-aeo-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run GEO-AEO audit
        run: npm run audit:geo-aeo -- --json
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blog-geo-aeo-report
          path: audit-geo-aeo-report.json
          if-no-files-found: warn
          retention-days: 14
